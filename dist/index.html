<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plainvoice · Data Review</title><meta name="description" content="Review writing pairs, revisions, references, and agent traces across the Plainvoice collection."><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><a class="brand" href="./"><span class="brand-mark">p.</span> plainvoice <span class="brand-sub">DATA REVIEW</span></a><div class="top-actions"><span id="mode" class="mode">正在连接资料库</span><button id="export">导出评审</button><button id="importReviews" class="quiet">导入评审</button><a href="https://github.com/onjas-6/plainvoice" target="_blank" rel="noreferrer">GitHub ↗</a><input type="file" id="reviewsFile" accept="application/json,.json" hidden></div></header>
<div class="workspace">
<aside class="library"><div class="library-title"><h1>资料库</h1><span id="total" class="count">—</span></div><div id="collections" class="collections"></div><div class="library-footer"><strong id="reviewCount">0 条已评审</strong><p>评审保存在当前浏览器，可随时导出。</p><a id="localLink" href="http://127.0.0.1:8876" hidden>打开本机全量资料库 ↗</a></div></aside>
<section class="queue"><div class="queue-head"><h2 id="collectionTitle">全部资料</h2><p id="collectionNote"></p><label class="search"><span>搜索</span><input id="search" type="search" placeholder="标题与对照正文" autocomplete="off"></label><div class="filters"><select id="language" aria-label="语言"><option value="">全部语言</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option><option value="mixed">多语言</option><option value="unknown">未标注</option></select><select id="pairType" aria-label="配对方式"><option value="">全部类型</option><option value="rewrite">改写 / 修订</option><option value="multi-reference">多参考答案</option><option value="same-task">同任务报告</option><option value="unpaired">单侧文本</option><option value="trace">Agent trace</option><option value="preference">偏好标注</option></select></div><label id="qualityFilterLabel" class="quality-filter" hidden>清理结果 <select id="qualityFilter"><option value="">全部</option><option value="review_candidate">改写候选 · 待人评</option><option value="quarantined">已隔离 · 需处理</option><option value="archive_only">其他原始任务</option></select></label><div class="queue-meta"><span id="resultCount">载入中</span><select id="reviewFilter" aria-label="评审状态"><option value="">所有状态</option><option value="unreviewed">未评审</option><option value="reviewed">已评审</option><option value="keep">保留</option><option value="reject">排除</option></select></div></div><div id="records" class="records" aria-live="polite"></div><nav class="pagination"><button id="prevPage" class="quiet">上一页</button><span id="pageInfo">—</span><button id="nextPage" class="quiet">下一页</button></nav></section>
<main id="main"><div id="message" class="message" role="status">正在载入资料库…</div><div id="detail" hidden><div class="detail-head"><div><div id="recordBadges" class="badges"></div><h2 id="recordTitle"></h2><p id="recordSub" class="subtle"></p></div><div class="detail-actions"><button id="previous" class="quiet" title="上一条（K）">←</button><button id="next" class="quiet" title="下一条（J）">→</button></div></div><div class="reading-options"><label id="textViewLabel">文本版本 <select id="textView"><option value="clean">清理后 · 正文</option><option value="raw">原始采集 / 生成</option></select></label><label><input type="checkbox" id="blind"> 隐藏来源标签</label><label><input type="checkbox" id="sync"> 同步滚动</label><label>字号 <select id="textSize"><option value="17">标准</option><option value="20">大</option><option value="23">更大</option></select></label><button id="copyPair" class="quiet">复制文本</button><button id="downloadPair" class="quiet">下载这组正文</button></div><p id="cleaningStatus" class="cleaning-status" role="status" hidden></p><details id="cleaningAudit" class="context-box" hidden><summary>查看清理记录与待复核问题</summary><pre id="cleaningAuditText"></pre></details><details id="contextBox" class="context-box"><summary>任务 / 上下文</summary><pre id="contextText"></pre></details><div id="comparison" class="comparison"><section class="text-pane"><div class="text-label"><strong id="leftLabel">A</strong><span id="leftLength"></span></div><pre id="leftText" class="prose" tabindex="0"></pre></section><section class="text-pane right-pane"><div class="text-label"><strong id="rightLabel">B</strong><span id="rightLength"></span></div><pre id="rightText" class="prose" tabindex="0"></pre></section></div><section id="alternativesBox" class="extra-section" hidden><h3>其他候选 / 参考答案</h3><div id="alternatives"></div></section><details class="provenance"><summary>来源与配对依据</summary><div id="sourceInfo"></div><details><summary>全部附加记录（含 prompt、QA 或 trace）</summary><pre id="extraText"></pre></details></details><section class="review-panel"><div class="review-top"><h3>这组数据怎么处理？</h3><span id="saveStatus" role="status">未评审</span></div><div class="review-grid"><label>入选判断<select id="decision"><option value="">待评</option><option value="keep">保留</option><option value="needs-edit">需要修改</option><option value="reject">排除</option></select></label><label>表达偏好<select id="preference"><option value="">待评</option><option value="left">A 更好</option><option value="right">B 更好</option><option value="tie">接近</option><option value="neither">两者都不好</option><option value="not-applicable">不适用</option></select></label><label>内容保真<select id="fidelity"><option value="">待评</option><option value="preserved">未发现漂移</option><option value="omission">存在遗漏</option><option value="drift">意思有变化</option><option value="not-equivalent">本就不是同内容</option><option value="uncertain">无法判断</option></select></label><label>AI 味比较<select id="ainess"><option value="">待评</option><option value="left">A 更重</option><option value="right">B 更重</option><option value="tie">相近</option><option value="uncertain">无法判断</option></select></label></div><label class="notes-label">备注<textarea id="notes" rows="2" placeholder="哪句话有问题？为什么适合或不适合训练？"></textarea></label></section></div></main>
</div><div id="toast" role="status" hidden></div><script src="app.js" defer></script></body></html>
